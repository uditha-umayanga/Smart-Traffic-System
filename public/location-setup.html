<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set Active Duty Location and Nearby Officer ID">
  <title>Duty Location Setup - TRAFFIX CENTRAL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>TRAFFIX CENTRAL</h1>
    <nav>
      <a href="index.html" class="btn-logout">Cancel &amp; Logout</a>
    </nav>
  </header>

  <main class="gate-container">
    <section>
      <h2>Step 2: Duty Location &amp; Backup Officer Setup</h2>
      <p>Allow browser location access to auto-detect your GPS checkpoint, or type it manually.</p>

      <form id="dutyForm">
        <fieldset>
          <legend>Active Duty Checkpoint Details</legend>

          <div>
            <label for="dutyLocation">Current Duty Location / Checkpoint</label>
            <input type="text" id="dutyLocation" name="dutyLocation" placeholder="Detecting your GPS location..." required>
            <small id="gpsStatus" style="color: #38bdf8; display: block; margin-top: 6px;">Requesting GPS permission...</small>
            <button type="button" id="refreshGps" style="margin-top: 10px; background-color: #0284c7; padding: 8px 14px; font-size: 13px;">
              Refresh / Auto-Detect GPS Location
            </button>
          </div>

          <div>
            <label for="gpsCoords">GPS Coordinates (Latitude, Longitude)</label>
            <input type="text" id="gpsCoords" name="gpsCoords" placeholder="Waiting for GPS signal..." readonly>
          </div>

          <div>
            <label for="nearbyOfficer">Nearby / Backup Officer Badge ID</label>
            <input type="text" id="nearbyOfficer" name="nearbyOfficer" placeholder="Enter a registered Badge ID" required>
          </div>

          <button type="submit">Activate Duty Session &amp; Enter Dashboard</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TRAFFIX Central - Field Deployment System</p>
  </footer>

  <script src="common.js"></script>
  <script>
    const dutyForm = document.getElementById('dutyForm');
    const dutyLocation = document.getElementById('dutyLocation');
    const gpsCoords = document.getElementById('gpsCoords');
    const nearbyOfficer = document.getElementById('nearbyOfficer');
    const gpsStatus = document.getElementById('gpsStatus');

    function setStatus(text, color) {
      gpsStatus.textContent = text;
      gpsStatus.style.color = color;
    }

    function getAutoLocation() {
      if (!navigator.geolocation) {
        setStatus('Geolocation is not supported by your browser. Please type location manually.', '#ef4444');
        return;
      }
      setStatus('Locating GPS coordinates... Please click "Allow" if prompted.', '#38bdf8');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);
          gpsCoords.value = `${lat}, ${lon}`;

          try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await response.json();
            dutyLocation.value = data && data.display_name
              ? data.display_name.split(',').slice(0, 3).join(',')
              : `GPS Checkpoint (${lat}, ${lon})`;
            setStatus('● GPS location auto-detected successfully!', '#34d399');
          } catch (error) {
            dutyLocation.value = `GPS Checkpoint (${lat}, ${lon})`;
            setStatus('● Coordinates captured (address lookup unavailable).', '#34d399');
          }
        },
        (error) => {
          dutyLocation.placeholder = 'Enter location manually (e.g. street or checkpoint name)';
          setStatus(
            error.code === error.PERMISSION_DENIED
              ? 'Location permission denied. Please enter your duty location manually.'
              : 'Unable to detect GPS automatically. Please enter location manually.',
            '#f59e0b'
          );
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // If the officer already set a duty location, show it again
    guardPage({ needDuty: false }).then(session => {
      if (session && session.duty) {
        dutyLocation.value = session.duty.dutyLocation;
        gpsCoords.value = session.duty.gpsCoords || '';
        nearbyOfficer.value = session.duty.nearbyOfficer;
      }
    });

    document.getElementById('refreshGps').addEventListener('click', getAutoLocation);
    window.addEventListener('load', () => { if (!dutyLocation.value) getAutoLocation(); });

    dutyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/duty', {
          method: 'POST',
          body: {
            dutyLocation: dutyLocation.value,
            gpsCoords: gpsCoords.value,
            nearbyOfficer: nearbyOfficer.value
          }
        });
        location.href = 'home.html';
      } catch (err) {
        if (err.status === 401) return location.replace('index.html');
        alert(err.message);
      }
    });
  </script>
</body>
</html>
