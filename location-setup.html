<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set Active Duty Location and Nearby Officer ID">
  <title>Duty Location Setup - TRAFFIX CENTRAL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>TRAFFIX CENTRAL</h1>
    <nav>
      <a href="index.html" class="btn-logout">Cancel &amp; Logout</a>
    </nav>
  </header>

  <main class="gate-container">
    <section>
      <h2>Step 2: Duty Location &amp; Backup Officer Setup</h2>
      <p>Allow browser location access to auto-detect your current GPS checkpoint, or enter it manually.</p>

      <form action="home.html" method="get">
        <fieldset>
          <legend>Active Duty Checkpoint Details</legend>

          <div>
            <label for="dutyLocation">Current Duty Location / Checkpoint</label>
            <input type="text" id="dutyLocation" name="dutyLocation" placeholder="Detecting your GPS location..." required>
            <small id="gpsStatus" style="color: #38bdf8; display: block; margin-top: 6px;">Requesting GPS permission...</small>
            <button type="button" onclick="getAutoLocation()" style="margin-top: 10px; background-color: #0284c7; padding: 8px 14px; font-size: 13px;">
              Refresh / Auto-Detect GPS Location
            </button>
          </div>

          <div>
            <label for="gpsCoords">GPS Coordinates (Latitude, Longitude)</label>
            <input type="text" id="gpsCoords" name="gpsCoords" placeholder="Waiting for GPS signal..." readonly>
          </div>

          <div>
            <label for="patrolZone">Patrol Sector / Highway Zone</label>
            <select id="patrolZone" name="patrolZone" required>
              <option value="">-- Select Patrol Sector --</option>
              <option value="A2">A2 Highway Corridor</option>
              <option value="E01">E01 Southern Expressway</option>
              <option value="A1">A1 Colombo - Kandy Road</option>
              <option value="city">Colombo City Central Zone</option>
            </select>
          </div>

          <div>
            <label for="nearbyOfficer">Nearby / Backup Officer Badge ID</label>
            <input type="text" id="nearbyOfficer" name="nearbyOfficer" placeholder="e.g. POL-84925" required>
          </div>

          <button type="submit">Activate Duty Session &amp; Enter Dashboard</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TRAFFIX Central - Field Deployment System</p>
  </footer>

  <!-- Auto-Location Detection Script -->
  <script>
    function getAutoLocation() {
      const locationInput = document.getElementById("dutyLocation");
      const coordsInput = document.getElementById("gpsCoords");
      const statusText = document.getElementById("gpsStatus");

      if (!navigator.geolocation) {
        statusText.style.color = "#ef4444";
        statusText.textContent = "Geolocation is not supported by your browser. Please type location manually.";
        locationInput.placeholder = "Enter location manually";
        return;
      }

      statusText.style.color = "#38bdf8";
      statusText.textContent = "Locating GPS coordinates... Please click 'Allow' if prompted.";

      navigator.geolocation.getCurrentPosition(
        async function (position) {
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);
          coordsInput.value = `${lat}, ${lon}`;

          try {
            // Convert GPS Coordinates into a readable street/city name
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await response.json();

            if (data && data.display_name) {
              // Extract clean short address
              const addressParts = data.display_name.split(",").slice(0, 3).join(",");
              locationInput.value = addressParts;
            } else {
              locationInput.value = `GPS Checkpoint (${lat}, ${lon})`;
            }

            statusText.style.color = "#34d399";
            statusText.textContent = "● GPS Location Auto-Detected Successfully!";
          } catch (error) {
            locationInput.value = `GPS Checkpoint (${lat}, ${lon})`;
            statusText.style.color = "#34d399";
            statusText.textContent = "● Coordinates captured (Offline address lookup).";
          }
        },
        function (error) {
          statusText.style.color = "#f59e0b";
          locationInput.placeholder = "Enter location manually (e.g. Galle Road, Bambalapitiya)";
          if (error.code === error.PERMISSION_DENIED) {
            statusText.textContent = "Location permission denied. Please enter your duty location manually.";
          } else {
            statusText.textContent = "Unable to detect GPS automatically. Please enter location manually.";
          }
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Automatically run when the page loads
    window.onload = getAutoLocation;
  </script>
</body>
</html>
